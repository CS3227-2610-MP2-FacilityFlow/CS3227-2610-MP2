name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check (Linux with virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a sh ./gradlew build --no-daemon
      - name: Build and check (macOS)
        if: runner.os == 'macOS'
        run: sh ./gradlew build --no-daemon
      - name: Build and check (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat build --no-daemon
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: build/reports/
          if-no-files-found: ignore
