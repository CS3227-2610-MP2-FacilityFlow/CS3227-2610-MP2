name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build.gradle
      - scripts/smoke_test_jar.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test release smoke gate
        run: python -m unittest discover -s src/test/python -p 'test_*.py' -v
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = 'v1.0.1'
      - name: Verify and build 64-bit Windows, Linux, and Intel Mac JAR
        run: xvfb-run -a sh ./gradlew clean check shadowJar --no-daemon
      - name: Smoke test on Linux
        run: xvfb-run -a python scripts/smoke_test_jar.py build/libs/facilityflow-1.0.1.jar
      - uses: actions/upload-artifact@v4
        with:
          name: facilityflow-universal-x86_64
          path: build/libs/facilityflow-1.0.1.jar
          if-no-files-found: error

  macos-arm:
    runs-on: macos-15-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check runner architecture
        run: test "$(uname -m)" = 'arm64'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = 'v1.0.1'
      - name: Verify and build Apple silicon JAR
        run: sh ./gradlew clean check shadowJar -PreleaseTarget=macos-aarch64 --no-daemon
      - name: Smoke test on Apple silicon
        run: python scripts/smoke_test_jar.py build/libs/facilityflow-1.0.1-macos-aarch64.jar
      - uses: actions/upload-artifact@v4
        with:
          name: facilityflow-macos-aarch64
          path: build/libs/facilityflow-1.0.1-macos-aarch64.jar
          if-no-files-found: error

  smoke-universal:
    needs: universal
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: facilityflow-universal-x86_64
          path: dist
      - name: Smoke test the same JAR on Windows
        if: runner.os == 'Windows'
        run: python scripts/smoke_test_jar.py dist/facilityflow-1.0.1.jar
      - name: Smoke test the same JAR on Intel macOS with software rendering
        if: runner.os == 'macOS'
        env:
          JAVA_TOOL_OPTIONS: -Dprism.order=sw
        run: python scripts/smoke_test_jar.py dist/facilityflow-1.0.1.jar
      - name: Show recent macOS Java crash report
        if: failure() && runner.os == 'macOS'
        run: |
          reports="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$reports" ]; then
            find "$reports" -maxdepth 1 -type f -name 'java*.ips' -mmin -10 \
              -print -exec sed -n '1,100p' {} \;
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [universal, macos-arm, smoke-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: facilityflow-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.jar > SHA256SUMS.txt
      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          fi
