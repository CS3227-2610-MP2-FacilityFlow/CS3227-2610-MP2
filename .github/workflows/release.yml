name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and package on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a sh ./gradlew clean check releaseZip --no-daemon
      - name: Verify and package on macOS
        if: runner.os == 'macOS'
        run: sh ./gradlew clean check releaseZip --no-daemon
      - name: Verify and package on Windows
        if: runner.os == 'Windows'
        run: ./gradlew.bat clean check releaseZip --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: facilityflow-${{ runner.os }}
          path: build/release/*.zip

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: facilityflow-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes
