name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and build the cross-platform JAR
        run: xvfb-run -a sh ./gradlew clean check shadowJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: facilityflow-release-jar
          path: build/libs/facilityflow-*.jar
          if-no-files-found: error

  smoke-test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: facilityflow-release-jar
          path: dist
      - name: Launch the same release JAR on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_test_jar.py dist/facilityflow-1.0.0.jar
      - name: Launch the same release JAR on macOS or Windows
        if: runner.os != 'Linux'
        run: python scripts/smoke_test_jar.py dist/facilityflow-1.0.0.jar

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: facilityflow-release-jar
          path: dist
      - name: Create checksum
        working-directory: dist
        run: sha256sum *.jar > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes
