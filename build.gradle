plugins {
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.4.3'
}

group = 'sg.edu.nus.facilityflow'
version = '1.0.1'
def javafxVersion = '25.0.2'
def appleSiliconHost = System.getProperty('os.name').toLowerCase().contains('mac')
        && System.getProperty('os.arch').toLowerCase() in ['aarch64', 'arm64']
def releaseTarget = providers.gradleProperty('releaseTarget')
        .orElse(appleSiliconHost ? 'macos-aarch64' : 'universal-x86_64').get()
if (!(releaseTarget in ['universal-x86_64', 'macos-aarch64'])) {
    throw new GradleException("Unsupported releaseTarget: ${releaseTarget}")
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = javafxVersion
    modules = ['javafx.controls']
}

application {
    mainClass = providers.gradleProperty('mainClass').orElse('sg.edu.nus.facilityflow.FacilityFlowLauncher')
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveClassifier = releaseTarget == 'macos-aarch64' ? 'macos-aarch64' : ''
    mergeServiceFiles()
    manifest {
        attributes(
            'Main-Class': 'sg.edu.nus.facilityflow.FacilityFlowLauncher',
            'Enable-Native-Access': 'ALL-UNNAMED',
            'Implementation-Title': 'FacilityFlow',
            'Implementation-Version': project.version
        )
    }
}

// The release artifact is the Shadow JAR, not the Application plugin's launchers or archives.
// Running those alongside the classifier-free JAR makes Gradle 9 detect an implicit dependency.
['startScripts', 'startShadowScripts', 'distZip', 'distTar', 'shadowDistZip', 'shadowDistTar']
        .each { distributionTask ->
    tasks.named(distributionTask) {
        enabled = false
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'

    // Native library resource names collide across Mac architectures, so ship a separate ARM JAR.
    if (releaseTarget == 'universal-x86_64') {
        runtimeOnly "org.openjfx:javafx-graphics:${javafxVersion}:win"
        runtimeOnly "org.openjfx:javafx-graphics:${javafxVersion}:linux"
        runtimeOnly "org.openjfx:javafx-graphics:${javafxVersion}:mac"
    }

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    finalizedBy jacocoTestReport
}

checkstyle {
    toolVersion = '10.26.1'
    maxWarnings = 0
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

wrapper {
    gradleVersion = '9.1.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806'
}

tasks.named('check') {
    dependsOn jacocoTestReport
}
