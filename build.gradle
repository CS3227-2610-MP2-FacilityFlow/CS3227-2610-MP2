plugins {
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.4.3'
}

group = 'sg.edu.nus.facilityflow'
version = '1.0.0'
def javafxVersion = '25.0.2'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = javafxVersion
    modules = ['javafx.controls']
}

application {
    mainClass = providers.gradleProperty('mainClass').orElse('sg.edu.nus.facilityflow.FacilityFlowLauncher')
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    mergeServiceFiles()
    manifest {
        attributes(
            'Main-Class': 'sg.edu.nus.facilityflow.FacilityFlowLauncher',
            'Enable-Native-Access': 'ALL-UNNAMED',
            'Implementation-Title': 'FacilityFlow',
            'Implementation-Version': project.version
        )
    }
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'

    // Include JavaFX native libraries for each desktop OS in the runnable fat JAR.
    runtimeOnly "org.openjfx:javafx-graphics:${javafxVersion}:win"
    runtimeOnly "org.openjfx:javafx-graphics:${javafxVersion}:linux"
    runtimeOnly "org.openjfx:javafx-graphics:${javafxVersion}:mac"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    finalizedBy jacocoTestReport
}

checkstyle {
    toolVersion = '10.26.1'
    maxWarnings = 0
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

wrapper {
    gradleVersion = '9.1.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806'
}

tasks.named('check') {
    dependsOn jacocoTestReport
}
